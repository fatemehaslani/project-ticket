{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}Ticketing App{% endblock %}</title>
    <meta name="description" content="{{ site_settings.meta_description }}">
    <meta name="keywords" content="{{ site_settings.meta_keywords }}">
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icon/bootstrap-icons.min.css' %}" rel="stylesheet">
</head>
<body data-bs-theme="">

{% include 'nav.html' %}

<!-- ============ دکمه خروج ============ -->
{% if user.is_authenticated %}
<div class="logout-wrapper">
    <button type="button" class="btn btn-logout" data-bs-toggle="modal" data-bs-target="#logoutModal">
        <i class="bi bi-box-arrow-right me-2"></i>
        خروج
    </button>
</div>

<!-- ============ مودال تأیید خروج ============ -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true" dir="rtl">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg logout-modal">
            <div class="modal-body text-center p-4">

                <div class="logout-icon mx-auto mb-3">
                    <i class="bi bi-box-arrow-right"></i>
                </div>

                <h5 class="fw-bold mb-2">خروج از حساب</h5>
                <p class="text-muted small mb-4">
                    آیا مطمئن هستید که می‌خواهید خارج شوید؟
                </p>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-light flex-fill fw-semibold" data-bs-dismiss="modal">
                        انصراف
                    </button>

                    <!-- 👇 فرم واقعی خروج -->
                    <form method="post" action="{% url 'logout' %}" class="flex-fill">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100 fw-semibold">
                            <i class="bi bi-box-arrow-right me-1"></i>
                            خروج
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endif %}

<main>
    {% block content %}

    {% endblock %}
</main>

<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

{% block js %}
{% endblock %}

<script>
    const colorModeElm = document.querySelector("#color-mode")
    const bodyElm = document.body

    document.addEventListener("DOMContentLoaded", function (){
        if( localStorage.getItem('default-color-theme')) {
            const theme = localStorage.getItem('default-color-theme')
            bodyElm.setAttribute("data-bs-theme", theme)
        } else {
            bodyElm.setAttribute("data-bs-theme", "dark")
        }
    })
  colorModeElm.addEventListener("click", function (){
      if (bodyElm.getAttribute("data-bs-theme") === "light") {
        bodyElm.setAttribute("data-bs-theme", "dark")
        localStorage.setItem('default-color-theme', "dark")
    } else {
        document.body.setAttribute("data-bs-theme", "light")
        localStorage.setItem('default-color-theme', "light")
    }
  })




</script>

</body>
</html>
